server: # 服务器元数据
  name: YA_MCPServer_KnowledgeManager
  name_zh: 个性化知识管理智能体
  author: 李琬琦、刘光悦、陈虞林
  description: A personalized knowledge management agent with semantic search and intelligent organization.
  description_zh: 基于语义搜索和智能组织的个性化知识管理智能体，支持笔记存储、检索和关联分析。
  version: 0.1.0

transport: # 服务器启动方式配置
  type: "sse" # 可选值: stdio, sse
  host: "127.0.0.1" # 仅在 type 为 sse 时有效，表示监听地址，默认为 0.0.0.0
  port: 12345 # 仅在 type 为 sse 时有效，表示监听端口，默认为 12345

logging: # 日志配置
  console:
    enabled: true
    level: "DEBUG"
  file:
    enabled: true
    level: "DEBUG"
    path: "logs/%Y-%m-%d_%H-%M-%S.log"
    rotation: "10 MB"
    retention: "7 days"
    compression: "zip"
